name: Deploy to GitHub Pages

# Triggers:
#   push to main          deploys the code. Without the Supabase secrets it builds the v1 local
#                         content and warns loudly, so the site keeps working before hosting is set up.
#   repository_dispatch   type `publish`, sent by the `publish` Edge Function. Needs the secrets; fails without.
#   workflow_dispatch     manual rebuild from the live snapshot. Needs the secrets; fails without.
#
# Repo secrets (Settings > Secrets and variables > Actions), see README "Deploy":
#   SUPABASE_URL, SUPABASE_ANON_KEY   hosted project URL and anon/publishable key (read-only, RLS)
#   PUBLISH_STATUS_TOKEN              same value as the Edge Function secret; reports run progress
# The service-role key is NOT a deploy secret.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RUN_ID: ${{ github.event.client_payload.run_id }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SB_URL: ${{ secrets.SUPABASE_URL }}
      SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      STATUS_TOKEN: ${{ secrets.PUBLISH_STATUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the content source
        id: config
        run: |
          if [ -n "$SB_URL" ] && [ -n "$SB_KEY" ]; then
            echo "source=supabase" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::warning title=Supabase secrets missing::SUPABASE_URL / SUPABASE_ANON_KEY are not set. Building the local v1 content. Add them to publish from Supabase."
            echo "source=local" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Supabase secrets missing::SUPABASE_URL and SUPABASE_ANON_KEY must be set as repo secrets for '$GITHUB_EVENT_NAME' deploys."
            exit 1
          fi

      - name: Report building
        if: github.event_name == 'repository_dispatch' && env.RUN_ID != ''
        run: ./.github/scripts/report-publish-status.sh building

      - name: Check Supabase is reachable
        if: steps.config.outputs.source == 'supabase'
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H "apikey: $SB_KEY" -H "content-type: application/json" -d '{}' \
            "${SB_URL%/}/rest/v1/rpc/get_published_content") || code=000
          if [ "$code" != "200" ]; then
            echo "::error title=Supabase unreachable::get_published_content() answered HTTP $code at the configured SUPABASE_URL."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: npm ci

      # Entries are keyed by a hash of each source file inside this directory, so a restore
      # from any earlier run only ever serves variants whose source is unchanged.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cesart-media-variants
          key: media-variants-${{ github.run_id }}
          restore-keys: media-variants-

      - name: Build
        run: npm run build
        env:
          CONTENT_SOURCE: ${{ steps.config.outputs.source }}
          PUBLIC_SUPABASE_URL: ${{ steps.config.outputs.source == 'supabase' && secrets.SUPABASE_URL || '' }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ steps.config.outputs.source == 'supabase' && secrets.SUPABASE_ANON_KEY || '' }}
          MEDIA_VARIANTS: required

      - name: Check the bundle has no secrets
        run: npm run check:bundle

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tells publish-status how the run ended, whatever happened above.
  report:
    needs: [build, deploy]
    if: always() && github.event_name == 'repository_dispatch' && github.event.client_payload.run_id != ''
    runs-on: ubuntu-latest
    env:
      SB_URL: ${{ secrets.SUPABASE_URL }}
      STATUS_TOKEN: ${{ secrets.PUBLISH_STATUS_TOKEN }}
      BUILD_RESULT: ${{ needs.build.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            ./.github/scripts/report-publish-status.sh succeeded
          else
            ./.github/scripts/report-publish-status.sh failed "build: $BUILD_RESULT, deploy: $DEPLOY_RESULT. See the workflow run."
          fi
