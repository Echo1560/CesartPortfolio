name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MEDIA_VARIANTS: required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/cesart-media-variants
          key: media-variants-${{ github.run_id }}
          restore-keys: media-variants-
      - run: npm run check
      - run: npm test
      - run: npm run validate:content
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx lhci autorun

  database:
    # Local Supabase in Docker: migrations, seed, pgTAP RLS/storage tests and API checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run db:seed:check
      - run: npx supabase start -x studio,postgres-meta,logflare,vector,imgproxy,mailpit,realtime,edge-runtime
      - run: npm run db:test
      - run: npm run db:test:api
      # Upload content/media to the bucket, then build once per CONTENT_SOURCE and diff the HTML.
      - name: Import content into local Supabase
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')"
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run db:import
      - run: npm run test:parity
      - if: always()
        run: npx supabase stop --no-backup

  functions:
    # Edge Functions (Deno) under `supabase functions serve` against local
    # Supabase, GitHub API mocked. Needs Auth's mail server (mailpit) for invites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run functions:check
      - run: npx supabase start -x studio,postgres-meta,logflare,vector,imgproxy,realtime
      - run: npm run functions:test
      - if: always()
        run: npx supabase stop --no-backup

  secrets:
    # No committed secrets (full history). The built site is checked by `npm run check:bundle` in `test`
    # and again before every deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: The service-role key is not a workflow secret
        run: |
          if grep -rnE 'secrets\.SUPABASE_SERVICE_ROLE|secrets\.[A-Z_]*SERVICE_ROLE' .github; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY must not be used as a GitHub Actions secret."
            exit 1
          fi
