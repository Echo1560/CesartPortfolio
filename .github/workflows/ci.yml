name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run validate:content
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx lhci autorun

  database:
    # Local Supabase in Docker: migrations, seed, pgTAP RLS/storage tests and API checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run db:seed:check
      - run: npx supabase start -x studio,postgres-meta,logflare,vector,imgproxy,mailpit,realtime,edge-runtime
      - run: npm run db:test
      - run: npm run db:test:api
      - if: always()
        run: npx supabase stop --no-backup
